<!doctype html>
<!--
  PRD §16 technical spike.

  This page exists to prove the six riskiest behaviors before any interface work:

    1. a persistent p5.js draw() loop running p5.sound analysis
    2. replacing one named drawing callback from a textarea
    3. preserving that callback's state by name across the replacement
    4. rejecting a syntax error without replacing the live callback
    5. rolling back after a first-frame runtime error
    6. audio playback position and FFT analysis continuing throughout

  It is deliberately crude and self-contained. The real system in src/ supersedes it.
  Kept in the repo as an executable record of the spike, per §16.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Response — §16 spike</title>
    <!-- p5 must be a classic script in <head>: it binds window.setup/window.draw on
         the window `load` event, and deferred module scripts run before that. -->
    <script src="../vendor/p5.min.js"></script>
    <script src="../vendor/p5.sound.min.js"></script>
    <style>
      body { margin: 0; background: #0b0b0d; color: #ddd; font: 13px ui-monospace, monospace; }
      #ui { position: fixed; right: 0; top: 0; width: 420px; padding: 12px; }
      textarea { width: 100%; height: 220px; background: #16161a; color: #ddd;
                 border: 1px solid #333; font: 12px ui-monospace, monospace; padding: 8px; }
      #log { white-space: pre-wrap; margin-top: 8px; min-height: 120px; }
      button { background: #26262c; color: #ddd; border: 1px solid #444; padding: 6px 10px; }
    </style>
  </head>
  <body>
    <div id="ui">
      <button id="start">start audio (osc)</button>
      <p>Cmd/Ctrl+Enter in the textarea to evaluate.</p>
      <textarea id="src">
patch("rings", ({ audio, state }) => {
  state.n = (state.n || 0) + 1;          // accumulating state, proves #3
  background(11, 11, 13, 40);
  noFill();
  stroke(255);
  strokeWeight(3);
  const d = map(audio.level, 0, 1, 40, width * 0.8);
  circle(width / 2, height / 2, d);
  text("frames drawn by this patch name: " + state.n, 20, 30);
});</textarea>
      <div id="log"></div>
    </div>

    <script type="module">
      const log = (m) => {
        document.getElementById('log').textContent =
          `${new Date().toLocaleTimeString()}  ${m}\n` +
          document.getElementById('log').textContent;
      };

      // --- the minimum host -------------------------------------------------
      const active = new Map();   // name -> draw fn        (the last good version)
      const state = new Map();    // name -> state object   (keyed by NAME, not fn)
      let pending = null;         // {name, draw, prevDraw, prevState} awaiting a frame

      const patch = (name, draw) => { pending = { name, draw }; };

      let fft, amp, osc, started = false;

      window.setup = () => {
        createCanvas(window.innerWidth - 440, window.innerHeight);
        amp = new p5.Amplitude();
        fft = new p5.FFT();
        log('setup ran once — canvas created');
      };

      window.draw = () => {
        const audio = started
          ? { level: amp.getLevel(), spectrum: fft.analyze() }
          : { level: 0.2 + 0.15 * Math.sin(frameCount / 30), spectrum: [] };

        for (const [name, fn] of active) {
          push();
          try {
            fn({ audio, state: state.get(name) });
          } catch (err) {
            pop();
            // First-frame runtime error: restore the previous version (#5).
            if (pending && pending.name === name && pending.committing) {
              active.set(name, pending.prevDraw);
              state.set(name, pending.prevState);
              log(`ROLLBACK ${name}: ${err.message} — previous version restored`);
              pending = null;
            }
            continue;
          }
          pop();
        }

        if (pending && !pending.committing) {
          pending.prevDraw = active.get(pending.name);
          pending.prevState = structuredClone(state.get(pending.name) ?? {});
          if (!state.has(pending.name)) state.set(pending.name, {});
          active.set(pending.name, pending.draw);
          pending.committing = true;   // survives one frame -> committed
        } else if (pending?.committing) {
          log(`COMMIT ${pending.name} — state preserved: ${JSON.stringify(state.get(pending.name))}`);
          pending = null;
        }
      };

      // --- evaluation -------------------------------------------------------
      const evaluate = (source) => {
        let fn;
        try {
          fn = new Function('patch', source);        // SyntaxError caught here (#4)
        } catch (err) {
          log(`REJECTED (syntax): ${err.message} — active patch untouched`);
          return;
        }
        try {
          fn(patch);
        } catch (err) {
          log(`REJECTED (registration): ${err.message} — active patch untouched`);
          pending = null;
        }
      };

      const ta = document.getElementById('src');
      ta.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
          e.preventDefault();
          evaluate(ta.value);
        }
      });

      document.getElementById('start').addEventListener('click', async () => {
        await getAudioContext().resume();
        osc = new p5.Oscillator('sine');
        osc.freq(110); osc.amp(0.3); osc.start();
        amp.setInput(osc); fft.setInput(osc);
        started = true;
        log('audio context running, analyzers attached');
      });

      // Report readiness so an automated check can read it off the page.
      window.__spike = { active, state, log };
      log('module ran before window load — window.setup assigned');
    </script>
  </body>
</html>
